<body>
<header class="top"><div class="nav"><a class="brand" href="#welcome"><span class="mark">⛑</span><span>Roshan Rozgar</span></a><nav class="mainnav"><button class="navitem" data-go="customer-home">Home</button><button class="navitem" data-go="workers">Find Workers</button><button class="navitem" data-go="booking">My Bookings</button><button class="navitem" data-go="worker-home">Worker Dashboard</button></nav><div class="navright"><span class="smallpill">📍 G-11, Islamabad</span><button class="profilebubble" data-go="welcome" aria-label="Switch role">↔</button></div></div></header>
<main class="container render-stage" id="view" aria-live="polite"></main>
<div class="bottom" id="mobileNav"><button data-go="customer-home"><b>⌂</b>Home</button><button data-go="workers"><b>⌕</b>Workers</button><button data-go="booking"><b>▦</b>Bookings</button><button data-go="worker-home"><b>♟</b>Worker</button></div>

<script>
const state={page:'welcome',service:'Plumber',offline:false,quoteAgreed:false,booked:false,done:false,stars:5,voice:false};
const workerList=[{name:'Ali Raza',trade:'Plumber',distance:'1.2 km',rating:'4.8',count:12,price:'Rs. 2,500',jobs:48,initials:'AR'},{name:'Imran Khan',trade:'Plumber',distance:'2.3 km',rating:'4.6',count:8,price:'Rs. 2,700',jobs:36,initials:'IK'},{name:'Waqas Ahmed',trade:'Plumber',distance:'3.1 km',rating:'4.5',count:10,price:'Rs. 2,800',jobs:29,initials:'WA'}];
const voices=()=>`<div class="wave" aria-label="Illustrative voice waveform">${[7,12,21,11,24,16,6,15,26,10,17,23,9,13,20].map(h=>`<i style="--h:${h}"></i>`).join('')}</div>`;
const btn=(label,target,cls='')=>`<button class="btn ${cls}" data-go="${target}">${label}</button>`;
const h=(name,desc,eyebrow='')=>`<div class="pagehead"><div class="sectionlabel">${eyebrow}</div><h1>${name}</h1><p>${desc}</p></div>`;
const rating=(w)=>`<span class="stars">★ ${w.rating} (${w.count})</span>`;
const workerCard=(w,action='worker-profile')=>`<div class="card worker"><div class="avatar">${w.initials}</div><div class="workerinfo"><strong>${w.name}</strong><div class="meta">${w.trade} · ${w.distance}</div><div class="row wrap" style="gap:7px;margin-top:5px">${rating(w)}<span class="tag">● Available</span></div></div><div class="workeraction"><span class="price">${w.price}</span>${btn('View Profile →',action)}</div></div>`;
const row=(label,val)=>`<div class="topicrow"><span>${label}</span><strong>${val}</strong></div>`;
const steps=(active)=>`<div class="timeline">${['Request accepted','Price agreed','Booking confirmed','Work in progress','Job completed'].map((s,i)=>`<div class="step"><span class="dot ${i<=active?'done':''}">${i<=active?'✓':i+1}</span><div><strong>${s}</strong><small>${i<=active?'Updated':'Pending'}</small></div></div>`).join('')}</div>`;
const pages={
'welcome':()=>`<div class="center landing"><span class="tag">CUI Tech Fest · Full-Stack Web & Applied AI</span><h1>Ghar ke Kaam ke Liye<br><span style="color:var(--emerald)">Bharosemand Hunarmand</span></h1><p>Nearby, available skilled workers for households. A simple voice-first experience for people who prefer speaking over typing.</p></div><div class="grid two" style="max-width:920px;margin:auto"><div class="persona"><div><div class="emo">👷🏽‍♂️</div><h2>Main Hunarmand Hoon</h2><p>Voice se profile banayein aur kaam hasil karein.</p></div><div class="mt">${btn('Continue as Worker →','worker-onboard','block')}</div></div><div class="persona" style="background:#fff"><div><div class="emo">🏠</div><h2>Mujhe Hunarmand Chahiye</h2><p>Qareeb available worker dhoondein.</p></div><div class="mt">${btn('Find a Worker →','customer-home','block')}</div></div></div>`,
'customer-home':()=>`<section class="hero"><div class="herotext"><div class="eyebrow">Roshan Rozgar · Islamabad</div><h1>Find trusted skilled workers near you.</h1><p>Plumbing, electrical, AC repair and carpentry help — describe your problem by voice or choose a service.</p><div class="row wrap">${btn('🎙️ Awaz mein masla batayein','customer-request')}${btn('Browse workers →','workers','secondary')}</div></div><div class="heroart"><span>👷🏽‍♂️</span></div></section><div class="secthead"><h2>Popular services</h2><span class="helper">Select to start a request</span></div><div class="grid four services">${[['🚰','Plumber','Leaks & pipes'],['⚡','Electrician','Wiring & repairs'],['❄️','AC Technician','Cooling & service'],['🔨','Carpenter','Furniture & fittings']].map(x=>`<button class="card service" onclick="selectService('${x[1]}')"><span class="ico">${x[0]}</span><span><strong>${x[1]}</strong><small>${x[2]}</small></span></button>`).join('')}</div><div class="secthead"><h2>Available workers nearby</h2>${btn('View all →','workers','secondary')}</div><div class="grid three">${workerList.map(w=>workerCard(w)).join('')}</div>`,
'customer-request':()=>`${h('Tell us what needs fixing','Select your service or describe the problem aloud. AI extraction will be integrated in the real application.','Customer · Step 1 of 6')}<div class="cols"><div class="card"><div class="sectionlabel">Service details</div><label class="field"><span>Service category</span><div class="pillbar">${['Plumber','Electrician','AC Technician','Carpenter'].map(x=>`<button class="pill ${x===state.service?'active':''}" onclick="selectService('${x}',true)">${x}</button>`).join('')}</div></label><label class="field"><span>Describe the problem</span><textarea id="problem" placeholder="Kitchen mein pipe leak ho raha hai.">Kitchen mein pipe leak ho raha hai.</textarea></label><label class="field"><span>Location</span><input value="G-11, Islamabad" aria-label="Location"></label><label class="field"><span>Preferred appointment</span><input type="datetime-local" value="2026-11-10T16:00"></label>${btn('Continue →','customer-confirm','block')}</div><div class="card"><div class="voice"><div class="sectionlabel">Voice-first alternative</div><div class="mic">🎙</div><h2 style="margin:0 0 6px">Awaz mein apna masla batayein</h2><div class="muted">Urdu, Roman Urdu or English</div>${voices()}<button class="btn secondary" onclick="showVoiceDemo()">${state.voice?'Stop (UI demonstration)':'🎙 Microphone UI Preview'}</button><div class="note-ui">Visual-only reference. Codex must connect genuine audio recording + OpenAI API.</div></div></div></div>`,
'customer-confirm':()=>`${h('Aapki request tayyar hai','Review the details before searching for available workers.','Customer · Step 2 of 6')}<div class="cols profile"><div class="card">${row('Service',state.service)}${row('Problem','Kitchen mein pipe leak ho raha hai')}${row('Location','G-11, Islamabad')}${row('Preferred time','10 Nov 2026, 4:00 PM')}<div class="mt row wrap">${btn('Nearby workers dekhein →','workers')}${btn('Edit details','customer-request','secondary')}</div></div><div class="wide-banner"><strong>AI interpretation preview</strong><p class="muted mini">The live app should only display details extracted from the user's speech and require confirmation before saving.</p><span class="tag outline">Confirm before matching</span></div></div>`,
'workers':()=>`${h('Qareeb Dastiyab Hunarmand','Plumbers near G-11, Islamabad, with available status and customer reviews.','Customer · Step 3 of 6')}<div class="cols aside"><aside class="card"><div class="sectionlabel">Find Workers</div><label class="field"><span>Trade</span><input value="Plumber"></label><label class="field"><span>Service area</span><input value="G-11, Islamabad"></label><div class="pillbar"><span class="tag">✓ Available</span><span class="tag grey">Nearest first</span></div><div class="divider"></div><div class="helper">Actual availability must be checked against the database. This is visual sample data.</div></aside><section class="list">${workerList.map(w=>workerCard(w)).join('')}</section></div>`,
'worker-profile':()=>`${h('Ali Raza — Plumber','Worker experience, proximity and genuine post-job review signals.','Customer · Step 4 of 6')}<div class="cols profile"><div><div class="card"><div class="row wrap"><div class="avatar lg">AR</div><div><h2 style="margin:0">Ali Raza</h2><div class="muted">Plumber · G-11, Islamabad</div><div class="row wrap mt">${rating(workerList[0])}<span class="tag">● Available Now</span></div></div></div><div class="stats mt"><div class="stat"><strong>5 yr</strong><small>Self-reported experience</small></div><div class="stat"><strong>48</strong><small>Completed jobs</small></div><div class="stat"><strong>1.2 km</strong><small>Approx distance</small></div></div><div class="secthead"><h2>Skills</h2></div><div class="pillbar"><span class="pill">Leakage repair</span><span class="pill">Pipe installation</span><span class="pill">Bathroom fitting</span></div><div class="secthead"><h2>Recent customer feedback</h2></div><div class="sidenote"><b>★ 5.0 · Ahmed K.</b><p class="mini">Kaam bohat acha kiya. Time par aaye.</p></div></div></div><aside class="card" style="align-self:start"><span class="label">Indicative visit charge</span><h1 style="margin:8px 0">Rs. 2,500</h1><p class="helper">Final amount is negotiated before booking. Identity is not government-verified in this MVP.</p>${btn('Raabta Karein →','chat','block')}<div class="divider"></div>${row('Service area','Islamabad G-11')}${row('Availability','Now')}${row('Rating','4.8 / 5')}</aside></div>`,
'chat':()=>`${h('Communication & Price Agreement','Agree on job scope and an exact PKR price before booking.','Customer · Step 5 of 6')}<div class="cols profile"><section class="card"><div class="row"><div class="avatar">AR</div><div><strong>Ali Raza</strong><div class="meta">Plumber · Available now</div></div><span class="tag" style="margin-left:auto">Voice friendly</span></div><div class="divider"></div><div class="bubble me">Assalam-o-Alaikum, mere kitchen mein pipe leak ho raha hai. Aaj 4 baje aa sakte hain?</div><div class="bubble mt">Wa Alaikum Assalam. Main aaj 4 baje aa sakta hoon.</div><div class="bubble mt">▶️ Voice reply · 0:12</div><div class="quote mt"><div class="label">Worker quotation</div><b>Rs. 2,500</b><div class="helper">Pipe leak repair + visit · 10 Nov, 4:00 PM</div></div><div class="row wrap mt"><button class="btn" onclick="state.quoteAgreed=true;render()">${state.quoteAgreed?'✓ Price agreed':'✓ Qeemat Qabool Karein'}</button> ${btn('Negotiate again','chat','secondary')}</div><div class="row mt"><input style="width:100%;border:1px solid var(--border);padding:13px;border-radius:12px" placeholder="Optional message…" aria-label="Message"><button class="btn secondary" aria-label="Voice message visual only" onclick="showVoiceDemo()">🎙</button></div></section><aside class="card" style="align-self:start"><div class="sectionlabel">Booking readiness</div>${row('Service','Plumbing repair')}${row('Area','G-11, Islamabad')}${row('Preferred time','Today, 4:00 PM')}${row('Agreed price',state.quoteAgreed?'Rs. 2,500':'Not agreed yet')}<div class="mt">${btn(state.quoteAgreed?'Confirm booking →':'Agree on price first','booking','block '+(!state.quoteAgreed?'ghost':''))}</div><p class="note-ui">The preview allows navigation to show layout. Real backend must reject booking without accepted quote.</p></aside></div>`,
'booking':()=>`${h(state.booked?'Booking confirmed!':'Confirm your booking','The customer and worker must see the same booking time and agreed price.','Customer · Step 6 of 6')}<div class="cols profile"><div class="card"><div class="center"><div class="success">✓</div><h2>${state.booked?'Apki Booking Confirm Ho Gayi Hai!':'Review before confirmation'}</h2><span class="tag">${state.booked?'Confirmed':'Awaiting confirmation'}</span></div><div class="divider"></div>${row('Worker','Ali Raza · Plumber')}${row('Service','Plumbing repair')}${row('Date','10 Nov 2026')}${row('Time','4:00 PM')}${row('Location','G-11, Islamabad')}${row('Agreed price','Rs. 2,500')}<div class="mt">${state.booked?btn('View job status →','worker-progress','block'):`<button class="btn block" onclick="state.booked=true;render()">✓ Confirm Booking</button>`}</div></div><aside class="card" style="align-self:start"><div class="sectionlabel">Availability integrity</div><div class="info">Once confirmed, the backend should reserve the worker and reject another overlapping booking.</div><div class="divider"></div>${steps(state.booked?2:1)}</aside></div>`,
'review':()=>`${h('Kaam Mukammal! Apna Tajurba Batayein.','Your review helps the next customer make an informed choice.','Customer · Final step')}<div class="card" style="max-width:680px;margin:auto"><div class="center"><div class="success">★</div><h2>Rate Ali Raza</h2><div class="helper">Completed plumbing job · G-11, Islamabad</div><div class="range" style="justify-content:center">${[1,2,3,4,5].map(n=>`<button class="starbtn" onclick="state.stars=${n};render()" aria-label="Rate ${n} stars">${n<=state.stars?'★':'☆'}</button>`).join('')}</div></div><label class="field"><span>Feedback (optional)</span><textarea placeholder="Apna tajurba likhein…">Bohat acha kaam kiya. Time par aaye.</textarea></label><div class="row wrap">${btn('🎙 Voice review (UI preview)','review','secondary')}<button class="btn" onclick="alert('UI design preview only. Codex must implement persisted review linked to completed booking.')">Submit Review →</button></div></div>`,
'worker-onboard':()=>`${h('Apni maloomat awaz mein batayein','No conventional sign-up form required. The worker speaks; AI extracts a usable profile.','Worker · Step 1 of 5')}<div class="cols"><div class="card"><div class="voice"><div class="sectionlabel">Voice guided registration</div><div class="mic">🎙</div><h2>Bol kar profile banayein</h2><p class="muted">Naam, hunar, tajurba aur ilaqa batayein.</p>${voices()}<button class="btn" onclick="showVoiceDemo()">${state.voice?'Stop recording preview':'🎙 Recording shuru karein'}</button><p class="note-ui">Codex: implement recording, OpenAI transcription and structured extraction, not a fake transcribe button.</p></div></div><div class="card"><h2>AI will ask simple questions</h2>${[['1','Aapka naam?'],['2','Aap kya kaam karte hain?'],['3','Kitna tajurba hai?'],['4','Kis ilaqay mein kaam karte hain?'],['5','Aapki visit charges?']].map(x=>`<div class="topicrow"><span><span class="tag">${x[0]}</span></span><strong>${x[1]}</strong></div>`).join('')}<div class="mt">${btn('Profile preview →','worker-confirm','block')}</div><p class="note-ui">Content is seeded here for visual demonstration, not an AI result.</p></div></div>`,
'worker-confirm':()=>`${h('Apni profile tasdeeq karein','Confirm the information extracted from your spoken introduction.','Worker · Step 2 of 5')}<div class="cols profile"><div class="card"><div class="row"><div class="avatar lg">AR</div><div><h2>Ali Raza</h2><span class="tag">Profile draft</span></div></div><div class="divider"></div>${row('Naam','Ali Raza')}${row('Hunar','Plumber')}${row('Tajurba','5 saal')}${row('Ilaqa','G-11, Islamabad')}${row('Visit charges','Rs. 2,500')}<div class="row wrap mt">${btn('✓ Tasdeeq Karein','worker-home')}${btn('🎙 Dobara Bolain','worker-onboard','secondary')}</div></div><aside class="wide-banner"><strong>Accessibility</strong><p class="mini">Production flow should read extracted information back aloud and permit voice corrections without requiring text entry.</p></aside></div>`,
'worker-home':()=>`${h('Salam Ali Raza! 👋','Manage your availability and incoming jobs with simple actions.','Worker · Dashboard')}<div class="cols profile"><div><div class="card"><div class="row wrap" style="justify-content:space-between"><div><h2 style="margin:0">Kaam ke liye dastiyab?</h2><p class="helper" style="margin:4px 0">Switch off whenever you cannot accept requests.</p></div><button class="btn ${state.offline?'secondary':''}" onclick="state.offline=!state.offline;render()">${state.offline?'◯ Filhal Masroof':'● Dastiyab Hoon'}</button></div><div class="stats mt"><div class="stat"><strong>2</strong><small>New requests</small></div><div class="stat"><strong>48</strong><small>Completed jobs</small></div><div class="stat"><strong>★ 4.8</strong><small>Customer rating</small></div></div></div><div class="secthead"><h2>New job request</h2></div><div class="card"><div class="row"><div class="avatar">AK</div><div><strong>Ahmed Khan</strong><div class="meta">Plumbing repair · G-11 · 4:00 PM</div></div></div><p class="mini">Kitchen mein pipe leak ho raha hai.</p><div class="row wrap">${btn('View request →','worker-request')}${btn('Voice reply','worker-request','secondary')}</div></div></div><aside class="card" style="align-self:start"><div class="sectionlabel">My bookings</div>${steps(state.booked?2:0)}${btn('View active job →','worker-progress','block')}</aside></div>`,
'worker-request':()=>`${h('Nayi kaam ki request',"Listen to the customer's problem, send a quote and accept the job.",'Worker · Step 3 of 5')}<div class="cols profile"><div class="card">${row('Customer','Ahmed Khan')}${row('Service','Plumbing repair')}${row('Area','G-11, Islamabad')}${row('Requested time','10 Nov, 4:00 PM')}<div class="voice mt"><strong>▶ Voice message · 0:18</strong>${voices()}<p class="helper">"Mere kitchen mein pipe leak ho raha hai..."</p></div><div class="quote mt"><div class="label">Your proposed quotation</div><b>Rs. 2,500</b></div><div class="row wrap mt">${btn('✓ Request Qabool Karein','worker-progress')}${btn('🎙 Voice response','worker-request','secondary')}${btn('Decline','worker-home','danger')}</div></div><aside class="card" style="align-self:start"><h2>Price agreement</h2><p class="helper">Customer must explicitly accept your quotation before booking becomes confirmable.</p><div class="info">A request is not a confirmed booking until agreement and server-side confirmation.</div></aside></div>`,
'worker-progress':()=>`${h('Job progress','Track a single confirmed booking and mark the job complete.','Worker · Step 4 of 5')}<div class="cols profile"><div class="card"><div class="row"><div class="avatar">AK</div><div><strong>Ahmed Khan</strong><div class="meta">G-11 Islamabad · Plumbing repair</div></div><span class="tag" style="margin-left:auto">${state.done?'Completed':'Active job'}</span></div><div class="divider"></div>${row('Service','Leak repair')}${row('Date / time','10 Nov, 4:00 PM')}${row('Agreed amount','Rs. 2,500')}<div class="mt">${state.done?btn('View customer review →','review','block'):`<button class="btn block" onclick="state.done=true;render()">✓ Kaam Mukammal Karein</button>`}</div></div><aside class="card" style="align-self:start"><div class="sectionlabel">Status timeline</div>${steps(state.done?4:3)}<div class="info">This static preview shows status styling only. Backend must persist transitions and free the worker after completion.</div></aside></div>`
};
function selectService(s,stay=false){state.service=s;state.page='customer-request';location.hash=state.page;render()}
function showVoiceDemo(){state.voice=!state.voice;render();alert('This is a static design preview. OpenAI voice recording/transcription must be implemented by Codex. No recording occurred.');}
function render(){const page=location.hash.slice(1)||state.page;if(!pages[page]){state.page='welcome'}else{state.page=page}const v=document.querySelector('#view');v.innerHTML=`<div class="notice"><span>UI HANDOFF · <b>Visual prototype only</b> · Example data is seeded</span><span><b>Responsive web</b> · Phone / Tablet / Desktop</span></div>${pages[state.page]()}`;document.querySelectorAll('[data-go]').forEach(el=>{el.onclick=()=>{state.page=el.dataset.go;location.hash=state.page;render();window.scrollTo(0,0)}});document.querySelectorAll('.navitem').forEach(el=>el.classList.toggle('active',el.dataset.go===state.page));document.querySelectorAll('.bottom button').forEach(el=>el.classList.toggle('active',el.dataset.go===state.page));}
window.addEventListener('hashchange',render);render();
</script></body></html>
